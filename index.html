
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Cinematic story sequencer and visualizer." />
    <title>Backstage Story Sequencer</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn.lucide.dev/icon/film.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Oswald:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
      html {
        font-size: 13px; /* Native 80% Compact Root Scale (1rem = 13px) */
        width: 100%;
        height: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      body { 
        margin: 0; 
        padding: 0;
        font-size: 13px;
        background-color: var(--bg-base, #0a0a0a); 
        color: var(--text-primary, #e5e7eb); 
        overflow: hidden; 
        height: 100%; 
        width: 100%; 
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
      
      /* Emergency Error Overlay */
      #error-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        color: #ff4444;
        padding: 40px;
        z-index: 9999;
        font-family: monospace;
        line-height: 1.5;
        overflow: auto;
      }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: '#f5a623',
              'page-bg': '#050505',
              'card-bg': '#1e1e1e',
              'border-muted': '#333333',
            },
            fontFamily: {
              screenplay: ['"Courier Prime"', 'monospace'],
              sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            borderRadius: {
              'none': '0',
              'sm': '0',
              'DEFAULT': '0',
              'md': '0',
              'lg': '0',
              'xl': '0',
              '2xl': '0',
              '3xl': '0',
              'full': '0',
            }
          }
        }
      }
    </script>

    <!-- Canvas Filter Intercept: Prevents Excalidraw dark mode from turning photos into negatives -->
    <script>
      (function() {
        function patchFilter(proto) {
          if (!proto) return;
          try {
            const desc = Object.getOwnPropertyDescriptor(proto, 'filter');
            if (desc && desc.set) {
              const origSet = desc.set;
              Object.defineProperty(proto, 'filter', {
                ...desc,
                set(val) {
                  if (typeof val === 'string' && val.includes('invert(')) {
                    return origSet.call(this, 'none');
                  }
                  return origSet.call(this, val);
                }
              });
            }
          } catch(e) {}
        }
        if (typeof window !== 'undefined') {
          if ('CanvasRenderingContext2D' in window) {
            patchFilter(window.CanvasRenderingContext2D.prototype);
          }
          if ('OffscreenCanvasRenderingContext2D' in window) {
            patchFilter(window.OffscreenCanvasRenderingContext2D.prototype);
          }
        }
      })();
    </script>

    <!-- Global Shim: Prevents "process is not defined" crash on static hosts like Netlify -->
    <script>
      window.process = { 
        env: { 
          NODE_ENV: 'production',
          API_KEY: "" // Prevents SDK crash on init if key is missing
        } 
      };
      
      // LocalStorage Quota Guard: Auto-prunes bloated legacy keys to guarantee healthy quota (<100KB)
      (function() {
        function pruneStorageBloat() {
          try {
            if (typeof localStorage === 'undefined') return;
            var keysToRemove = [];
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (!k) continue;
              if (
                k.indexOf('backstage_production_documents_') === 0 ||
                k.indexOf('project_data_') === 0 ||
                k.indexOf('cached_cloud_projects_') === 0 ||
                k === 'backstage_last_session'
              ) {
                try {
                  var v = localStorage.getItem(k);
                  if (v && v.length > 80000) {
                    keysToRemove.push(k);
                  }
                } catch(e) {}
              }
            }
            keysToRemove.forEach(function(k) {
              try { localStorage.removeItem(k); } catch(e) {}
            });
            if (keysToRemove.length > 0) {
              console.info('[BootGuard] Auto-pruned ' + keysToRemove.length + ' bloated localStorage keys to ensure healthy quota.');
            }
          } catch(e) {}
        }
        pruneStorageBloat();
        window.__pruneStorageBloat = pruneStorageBloat;
      })();

      // Global Error Handler with Self-Healing for Quota & Non-fatal Warnings
      window.addEventListener('error', (event) => {
        var msg = String(event.message || event.error || '');
        // Intercept QuotaExceededError and heal automatically without showing fatal crash overlay
        if (msg.indexOf('QuotaExceededError') !== -1 || msg.indexOf('quota') !== -1) {
          console.warn('[BootGuard] Caught QuotaExceededError - auto-healing storage...');
          if (window.__pruneStorageBloat) window.__pruneStorageBloat();
          event.preventDefault();
          return;
        }

        const overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML = `
            <h1 style="color: white; margin-bottom: 20px;">[Backstage] Boot Notice</h1>
            <p>An unexpected error occurred during startup.</p>
            <hr style="border-color: #333; margin: 20px 0;" />
            <pre style="max-height: 250px; overflow: auto; background: #111; padding: 15px; border-radius: 8px;">${msg.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</pre>
            <div style="margin-top: 25px; display: flex; gap: 15px; align-items: center;">
              <button onclick="localStorage.clear(); location.reload();" style="padding: 10px 18px; background: #f59e0b; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer;">
                Clear Local Storage &amp; Restart
              </button>
              <button onclick="document.getElementById('error-overlay').style.display='none';" style="padding: 10px 18px; background: #27272a; color: #fff; font-weight: bold; border: 1px solid #3f3f46; border-radius: 6px; cursor: pointer;">
                Dismiss &amp; Continue
              </button>
            </div>
            <p style="color: #666; font-size: 12px; margin-top: 20px;">Check your browser console for more details.</p>
          `;
        }
      });
    </script>

    <!-- App Scale / Font-Size Base Init (Default: 13px / 80% Compact Native Scale) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('app_zoom_level');
          var zoom = saved ? parseFloat(saved) : 0.8;
          if (isNaN(zoom) || zoom < 0.5 || zoom > 1.5) zoom = 0.8;
          var basePx = Math.round(16 * zoom * 10) / 10;
          document.documentElement.style.fontSize = basePx + 'px';
        } catch(e) {
          document.documentElement.style.fontSize = '13px';
        }
      })();
    </script>

    <link rel="preload" href="/fonts/vijaya.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/vijayab.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/MeeraInimai-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;700;900&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;700&family=Meera+Inimai&display=swap" rel="stylesheet">
    

    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.warn('SW Failed:', err));
        });
      }
    </script>
</head>
  <body>
    <div id="error-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
