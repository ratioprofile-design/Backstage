
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Cinematic story sequencer and visualizer." />
    <title>Backstage Story Sequencer</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn.lucide.dev/icon/film.svg">
    
    <style>
      :root {
        --page-bg: #050505;
        --card-bg: #1e1e1e;
        --accent: #f5a623;
        --text-main: #e5e7eb;
      }
      body { 
        margin: 0; 
        background-color: var(--page-bg); 
        color: var(--text-main); 
        overflow: hidden; 
        height: 100vh; 
        width: 100vw; 
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
      
      /* Emergency Error Overlay */
      #error-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        color: #ff4444;
        padding: 40px;
        z-index: 9999;
        font-family: monospace;
        line-height: 1.5;
        overflow: auto;
      }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: '#f5a623',
              'page-bg': '#050505',
              'card-bg': '#1e1e1e',
              'border-muted': '#333333',
            },
            fontFamily: {
              screenplay: ['"Courier Prime"', 'monospace'],
              sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Global Shim: Prevents "process is not defined" crash on static hosts like Netlify -->
    <script>
      window.process = { 
        env: { 
          NODE_ENV: 'production',
          API_KEY: "" // Prevents SDK crash on init if key is missing
        } 
      };
      
      // Global Error Handler for Deployment Debugging
      window.addEventListener('error', (event) => {
        const overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML = `
            <h1 style="color: white; margin-bottom: 20px;">[Backstage] Critical Boot Error</h1>
            <p>The application failed to start on this environment.</p>
            <hr style="border-color: #333; margin: 20px 0;" />
            <pre>${event.message}\nat ${event.filename}:${event.lineno}:${event.colno}</pre>
            <p style="color: #666; font-size: 12px; margin-top: 20px;">Check your browser console for more details.</p>
          `;
        }
      });
    </script>

    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;700;900&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.3.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "recharts": "https://esm.sh/recharts@2.13.3",
    "html2canvas": "https://esm.sh/html2canvas@1.4.1",
    "jspdf": "https://esm.sh/jspdf@2.5.1",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>

    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.warn('SW Failed:', err));
        });
      }
    </script>
  </head>
  <body>
    <div id="error-overlay"></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
