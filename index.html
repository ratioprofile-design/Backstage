
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Cinematic story sequencer and visualizer." />
    <title>Backstage Story Sequencer</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn.lucide.dev/icon/film.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      body { 
        margin: 0; 
        background-color: var(--bg-base, #0a0a0a); 
        color: var(--text-primary, #e5e7eb); 
        overflow: hidden; 
        height: 100vh; 
        width: 100vw; 
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
      
      /* Emergency Error Overlay */
      #error-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        color: #ff4444;
        padding: 40px;
        z-index: 9999;
        font-family: monospace;
        line-height: 1.5;
        overflow: auto;
      }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: '#f5a623',
              'page-bg': '#050505',
              'card-bg': '#1e1e1e',
              'border-muted': '#333333',
            },
            fontFamily: {
              screenplay: ['"Courier Prime"', 'monospace'],
              sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            borderRadius: {
              'none': '0',
              'sm': '0',
              'DEFAULT': '0',
              'md': '0',
              'lg': '0',
              'xl': '0',
              '2xl': '0',
              '3xl': '0',
              'full': '0',
            }
          }
        }
      }
    </script>

    <!-- Canvas Filter Intercept: Prevents Excalidraw dark mode from turning photos into negatives -->
    <script>
      (function() {
        function patchFilter(proto) {
          if (!proto) return;
          try {
            const desc = Object.getOwnPropertyDescriptor(proto, 'filter');
            if (desc && desc.set) {
              const origSet = desc.set;
              Object.defineProperty(proto, 'filter', {
                ...desc,
                set(val) {
                  if (typeof val === 'string' && val.includes('invert(')) {
                    return origSet.call(this, 'none');
                  }
                  return origSet.call(this, val);
                }
              });
            }
          } catch(e) {}
        }
        if (typeof window !== 'undefined') {
          if ('CanvasRenderingContext2D' in window) {
            patchFilter(window.CanvasRenderingContext2D.prototype);
          }
          if ('OffscreenCanvasRenderingContext2D' in window) {
            patchFilter(window.OffscreenCanvasRenderingContext2D.prototype);
          }
        }
      })();
    </script>

    <!-- Global Shim: Prevents "process is not defined" crash on static hosts like Netlify -->
    <script>
      window.process = { 
        env: { 
          NODE_ENV: 'production',
          API_KEY: "" // Prevents SDK crash on init if key is missing
        } 
      };
      
      // Global Error Handler for Deployment Debugging
      window.addEventListener('error', (event) => {
        const overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML = `
            <h1 style="color: white; margin-bottom: 20px;">[Backstage] Critical Boot Error</h1>
            <p>The application failed to start on this environment.</p>
            <hr style="border-color: #333; margin: 20px 0;" />
            <pre>${event.message}\nat ${event.filename}:${event.lineno}:${event.colno}</pre>
            <p style="color: #666; font-size: 12px; margin-top: 20px;">Check your browser console for more details.</p>
          `;
        }
      });
    </script>

    <link rel="preload" href="/fonts/vijaya.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/vijayab.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="/fonts/MeeraInimai-Regular.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;700;900&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;700&family=Meera+Inimai&display=swap" rel="stylesheet">
    

    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.warn('SW Failed:', err));
        });
      }
    </script>
</head>
  <body>
    <div id="error-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
