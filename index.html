
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Cinematic story sequencer and visualizer." />
    <title>Backstage Story Sequencer</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn.lucide.dev/icon/film.svg">
    
    <!-- Critical CSS: Prevent White Flash and define system colors immediately -->
    <style>
      :root {
        --page-bg: #050505;
        --card-bg: #1e1e1e;
        --accent: #f5a623;
        --text-main: #e5e7eb;
      }
      body { 
        margin: 0; 
        background-color: var(--page-bg); 
        color: var(--text-main); 
        overflow: hidden; 
        height: 100vh; 
        width: 100vw; 
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* Pre-styling for the root to avoid jumping */
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              accent: '#f5a623',
              'page-bg': '#050505',
              'card-bg': '#1e1e1e',
              'border-muted': '#333333',
            },
            fontFamily: {
              screenplay: ['"Courier Prime"', 'monospace'],
              sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <link rel="stylesheet" href="./style.css">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;700;900&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.39.7",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "html2canvas": "https://esm.sh/html2canvas@^1.4.1",
        "jspdf": "https://esm.sh/jspdf@^2.5.1",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174",
        "xlsx": "https://esm.sh/xlsx@0.18.5"
      }
    }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
