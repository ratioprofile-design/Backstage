<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Backstage Companion</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 310px;
      margin: 0;
      padding: 16px;
      background: #111319;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e2230;
    }
    .badge {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .status-row {
      font-family: monospace;
      font-size: 11px;
      margin-bottom: 12px;
    }
    .profile-card {
      background: #161922;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #232736;
      margin-bottom: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .profile-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f59e0b;
      background: #232736;
      flex-shrink: 0;
    }
    .profile-details {
      flex: 1;
      overflow: hidden;
    }
    .profile-name {
      font-weight: 700;
      color: #fff;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profile-handle {
      color: #f59e0b;
      font-family: monospace;
      font-size: 11px;
      font-weight: 600;
    }
    .profile-sub {
      color: #94a3b8;
      font-size: 10px;
      margin-top: 2px;
    }
    .handle-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .chip {
      background: #1e2230;
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 10px;
      font-family: monospace;
      border: 1px solid #2d3348;
      transition: all 0.15s;
    }
    .chip.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #f59e0b;
      font-weight: 700;
    }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #0b0c10;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: filter 0.2s;
    }
    .btn:hover {
      filter: brightness(1.1);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .manual-box {
      margin-top: 10px;
      display: flex;
      gap: 6px;
    }
    .manual-input {
      flex: 1;
      background: #161922;
      border: 1px solid #2d3348;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 11px;
      outline: none;
    }
    .manual-input:focus {
      border-color: #f59e0b;
    }
    .tip {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-top: 12px;
      border-top: 1px solid #1e2230;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-size: 22px;">🎬</div>
    <div>
      <div class="title">Backstage Casting</div>
      <div class="badge">Chrome Companion</div>
    </div>
  </div>

  <div id="status" class="status-row">Checking connection...</div>

  <div id="profile-container"></div>

  <div id="chips-container" class="handle-chips" style="display:none;"></div>

  <button id="sync-btn" class="btn">🎬 Send Profile to Backstage</button>

  <div id="manual-section" style="margin-top:12px; border-top:1px solid #1e2230; padding-top:10px;">
    <div style="color:#94a3b8; font-size:10px; margin-bottom:5px;">Or type/paste any Instagram link or handle:</div>
    <div class="manual-box">
      <input type="text" id="manual-handle" class="manual-input" placeholder="@actor_handle or profile URL" />
      <button id="manual-btn" class="chip" style="font-weight:700; padding:6px 10px;">Send</button>
    </div>
  </div>

  <div id="tip" class="tip">
    💡 <strong>Tip:</strong> You can click the <strong>🎬 Send to Backstage</strong> button directly on any post header, or click this popup!
  </div>

  <script src="popup.js"></script>
</body>
</html>
